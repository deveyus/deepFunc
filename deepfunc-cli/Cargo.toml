[package]
name = "deepfunc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
deepfunc-core = { path = "../deepfunc-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
flate2 = "1"
tar = "0.4"
lzma-rs = "0.3"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
