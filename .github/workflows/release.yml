name: release

# Tag a version (`git tag v0.1.0 && git push origin v0.1.0`) and this builds
# static Linux + Windows binaries, then attaches them to the GitHub release.
# macOS is deliberately excluded: provision refuses darwin (see provision.rs).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }} -p deepfunc-cli -p deepfunc-mcp
      - name: package (linux)
        if: matrix.archive == 'tar.gz'
        run: >
          tar -czf deepfunc-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          -C target/${{ matrix.target }}/release deepfunc-cli deepfunc-mcp
      - name: package (windows)
        if: matrix.archive == 'zip'
        run: >
          Compress-Archive -Path
          target/${{ matrix.target }}/release/deepfunc-cli.exe,target/${{ matrix.target }}/release/deepfunc-mcp.exe
          -DestinationPath deepfunc-${{ github.ref_name }}-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: deepfunc-${{ matrix.target }}
          path: deepfunc-${{ github.ref_name }}-*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: create release and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create ${{ github.ref_name }} --generate-notes
          dist/deepfunc-*
