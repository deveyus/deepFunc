name: ci

# Mirrors dev-scripts/gate.sh as closely as GitHub runners allow:
# same commands, same deny-warnings strictness, same pinned toolchain.
# coverage and verify stay local-only (need llvm-cov/kani from nix).
# When the flake's Rust advances, bump `toolchain:` below in the same
# commit — a floating CI toolchain breaks main on new lint releases.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - name: check
        run: cargo check --workspace --all-targets --locked
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- --deny warnings
      - name: fmt
        run: cargo fmt --all -- --check
      - name: test
        run: cargo test --workspace --locked
      - name: test-release
        run: cargo test --workspace --locked --release
